# smithery.yaml
startCommand:
  type: http
  url: "https://mcp.bancadia.com/"
  configSchema:
    type: object
    properties:
      apiToken:
        type: string
        description: "Your Bancadia API key generated from developer settings in https://bancadia.com/developer/signup"
        # Forward the configured value upstream as the Authorization header
        x-to:
          header: "Authorization"
    required:
      - apiToken