name = "bancadia-mcp"
main = "src/index.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

# Local dev vars are read from .dev.vars (git-ignored)
# Production secrets are set via: wrangler secret put <KEY> --env <environment>

[vars]
SUPABASE_URL = "https://test.supabase.co"
SUPABASE_SECRET_KEY = "test-secret-key"
UPSTASH_REDIS_REST_URL = "https://test.upstash.io"
UPSTASH_REDIS_REST_TOKEN = "test-token"
SESSION_TTL_SECONDS = "1800"
ALLOWED_ORIGINS = "https://bancadia.com,https://app.bancadia.com"

[env.staging]
name = "bancadia-mcp-staging"
workers_dev = true

[env.production]
name = "bancadia-mcp-production"
workers_dev = false
routes = [{ pattern = "mcp.bancadia.com/*", zone_name = "bancadia.com" }]
