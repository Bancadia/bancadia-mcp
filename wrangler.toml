name = "bancadia-mcp"
main = "src/index.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

# Local dev vars are read from .dev.vars (git-ignored)
# Production secrets are set via: wrangler secret put <KEY> --env <environment>

[vars]
SUPABASE_URL = "https://test.supabase.co"
SUPABASE_SECRET_KEY = "test-secret-key"
UPSTASH_REDIS_REST_URL = "https://test.upstash.io"
UPSTASH_REDIS_REST_TOKEN = "test-token"
SESSION_TTL_SECONDS = "1800"
ALLOWED_ORIGINS = "https://bancadia.com,https://app.bancadia.com"
# legacy | v2: default MCP tool profile (REST is always v2). Override per session with X-Bancadia-Profile or ?profile=.
MCP_PROFILE = "v2"

[env.staging]
name = "bancadia-mcp-staging"
workers_dev = true

# Vars are not inherited by envs, so the non-secret ones are repeated here. Supabase/Upstash come from secrets.
[env.staging.vars]

ALLOWED_ORIGINS = "https://bancadia-app-dev.up.railway.app"

[env.production]
name = "bancadia-mcp-production"
workers_dev = false
routes = [
  { pattern = "mcp.bancadia.com/*", zone_name = "bancadia.com" },
  { pattern = "api.bancadia.com", custom_domain = true },
]

# Browser origins allowed to call the Worker (admin dashboard). Supabase/Upstash come from secrets.
[env.production.vars]
ALLOWED_ORIGINS = "https://bancadia.com"
